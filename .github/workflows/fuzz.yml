name: Fuzz

on:
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:
    inputs:
      max_runs:
        description: Maximum inputs evaluated by each fuzz target
        required: true
        default: '10000'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: routing
            script: fuzz/routing.php
            corpus: fuzz/corpus/routing
            extensions: ctype, curl, date, dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: ${{ matrix.target.extensions }}
          coverage: none

      - name: Select the dependency lock
        run: cp composer.lock.php-8.3 composer.lock

      - name: Validate the Composer manifest against the lock file
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: .
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Restore the evolved corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ./${{ matrix.target.corpus }}
          key: fuzz-${{ matrix.target.name }}-${{ runner.os }}-${{ hashFiles('composer.lock.php-8.3') }}-${{ hashFiles('fuzz/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-${{ matrix.target.name }}-${{ runner.os }}-${{ hashFiles('composer.lock.php-8.3') }}-${{ hashFiles('fuzz/**') }}-
            fuzz-${{ matrix.target.name }}-${{ runner.os }}-${{ hashFiles('composer.lock.php-8.3') }}-
            fuzz-${{ matrix.target.name }}-${{ runner.os }}-

      - name: Run the fuzz target
        env:
          FUZZ_MAX_RUNS: ${{ inputs.max_runs || '10000' }}
        run: |
          set -euo pipefail

          case "$FUZZ_MAX_RUNS" in
            ''|*[!0-9]*)
              echo 'max_runs must be a positive integer.' >&2
              exit 2
              ;;
          esac
          if [ "$FUZZ_MAX_RUNS" -lt 1 ]; then
            echo 'max_runs must be a positive integer.' >&2
            exit 2
          fi

          mkdir -p "${{ matrix.target.corpus }}"
          vendor/bin/php-fuzzer fuzz \
            "${{ matrix.target.script }}" \
            "${{ matrix.target.corpus }}/" \
            "--max-runs=$FUZZ_MAX_RUNS"

      - name: Save the evolved corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ./${{ matrix.target.corpus }}
          key: fuzz-${{ matrix.target.name }}-${{ runner.os }}-${{ hashFiles('composer.lock.php-8.3') }}-${{ hashFiles('fuzz/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload crash inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-crashes-${{ matrix.target.name }}
          path: ./crash-*
          if-no-files-found: ignore
          retention-days: 14
