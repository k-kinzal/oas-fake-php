name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  tests:
    name: Tests on PHP ${{ matrix.php }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            deps: highest
            test-script: test:unit:9
          - php: '8.1'
            deps: highest
            test-script: test:unit:10
          - php: '8.2'
            deps: highest
            test-script: test:unit:11
          - php: '8.3'
            deps: highest
            test-script: test:unit:12
          - php: '8.4'
            deps: highest
            test-script: test:unit:12
          - php: '8.5'
            deps: highest
            test-script: test:unit:12
          - php: '8.0'
            deps: lowest
            test-script: test:unit:9
          - php: '8.5'
            deps: lowest
            test-script: test:unit:9
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          dependency-versions: ${{ matrix.deps }}
          composer-options: --prefer-dist
          require-lock-file: false

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Run unit and doctest suites
        run: composer ${{ matrix.test-script }}

  tests-parallel:
    name: Tests through the parallel runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, curl
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          dependency-versions: highest
          composer-options: --prefer-dist
          require-lock-file: false

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Run the suite under the parallel runner
        run: composer test

  lint:
    name: Lint on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl
          coverage: none

      - name: Validate the Composer manifest
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          dependency-versions: highest
          composer-options: --prefer-dist
          require-lock-file: false

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Check formatting
        run: composer format:check

      - name: Analyse contracts and types
        run: composer phpstan

      - name: Check compatibility with PHP 8.0 through 8.5
        run: composer compat

      - name: Check source size and complexity
        run: composer loc-guard

      - name: Check repository structure
        run: composer tree-guard

      - name: Check architecture layers
        run: composer deptrac

  mutation:
    name: Mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, curl
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          dependency-versions: highest
          composer-options: --prefer-dist
          require-lock-file: false

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Generate coverage for mutation testing
        run: >-
          php -d memory_limit=1G vendor/bin/phpunit
          --configuration phpunit.xml.dist
          --no-extensions
          --coverage-xml build/infection-coverage/coverage-xml
          --log-junit build/infection-coverage/junit.xml

      - name: Mutation testing on changed lines
        if: github.event_name == 'pull_request'
        run: >-
          php -d memory_limit=4G vendor/bin/infection
          --configuration=infection.json5
          --threads=max
          --coverage=build/infection-coverage
          --skip-initial-tests
          --git-diff-lines
          --git-diff-base="origin/${GITHUB_BASE_REF}"
          --ignore-msi-with-no-mutations
          --min-msi=90
          --min-covered-msi=90
          --no-progress
          --logger-github

      - name: Mutation testing on the whole source tree
        if: github.event_name != 'pull_request'
        run: >-
          php -d memory_limit=4G vendor/bin/infection
          --configuration=infection.json5
          --threads=max
          --coverage=build/infection-coverage
          --skip-initial-tests
          --no-progress
          --logger-github

  examples:
    name: Example ${{ matrix.example }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        example:
          - basic
          - configuration
          - custom-responses
          - declarative-server
          - faker-customization
          - middleware
          - request-validation
          - vcr-recording
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl
          coverage: none

      - name: Install example dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          working-directory: examples/${{ matrix.example }}
          dependency-versions: highest
          composer-options: --prefer-dist
          require-lock-file: false

      - name: Check installed platform requirements
        run: composer check-platform-reqs
        working-directory: examples/${{ matrix.example }}

      - name: Run example tests
        run: vendor/bin/phpunit
        working-directory: examples/${{ matrix.example }}
