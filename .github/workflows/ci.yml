name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  tests:
    name: Tests on PHP ${{ matrix.php }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            deps: highest

          - php: '8.1'
            deps: highest

          - php: '8.2'
            deps: highest

          - php: '8.3'
            deps: highest

          - php: '8.4'
            deps: highest

          - php: '8.5'
            deps: highest

          - php: '8.0'
            deps: lowest

          - php: '8.5'
            deps: lowest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, date, dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          dependency-versions: ${{ matrix.deps }}
          composer-options: --prefer-dist
          require-lock-file: false

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Validate the installed PHPUnit schema
        run: |
          major="$(composer show phpunit/phpunit --format=json | jq -r '.versions[0] | split(".")[0]')"
          config="phpunit${major}.xml.dist"
          if [ "$major" = 13 ]; then config=phpunit.xml.dist; fi
          php -r '$document = new DOMDocument(); $document->load($argv[1]); exit($document->schemaValidate("vendor/phpunit/phpunit/phpunit.xsd") ? 0 : 1);' "$config"

      - name: Run unit and doctest suites
        run: composer test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: ctype, curl, date, dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter
          coverage: none
          tools: deptrac/deptrac:4.7.1

      - name: Validate the Composer manifest
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          dependency-versions: highest
          composer-options: --prefer-dist
          require-lock-file: false

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Check formatting
        run: composer format:check

      - name: Analyse contracts and types
        run: composer phpstan

      - name: Check compatibility with PHP 8.0 through 8.5
        run: composer compat

      - name: Check source size and complexity
        run: composer loc-guard

      - name: Check repository structure
        run: composer tree-guard

      - name: Check architecture layers
        run: |
          deptrac --version
          composer deptrac

  mutation:
    name: Mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: ctype, curl, date, dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter
          coverage: pcov
          ini-values: memory_limit=1G
          tools: infection:0.35.4

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          dependency-versions: highest
          composer-options: --prefer-dist
          require-lock-file: false

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Select the PHPUnit 12 configuration installed on PHP 8.3
        run: cp phpunit12.xml.dist phpunit.xml.dist

      - name: Mutation testing on changed lines
        if: github.event_name == 'pull_request'
        run: >-
          infection
          --configuration=infection.json5
          --threads=max
          --only-covering-test-cases
          --git-diff-lines
          --git-diff-base="origin/${GITHUB_BASE_REF}"
          --ignore-msi-with-no-mutations
          --min-msi=90
          --min-covered-msi=90
          --no-progress
          --logger-github

      - name: Mutation testing on the whole source tree
        if: github.event_name != 'pull_request'
        run: >-
          infection
          --configuration=infection.json5
          --threads=max
          --only-covering-test-cases
          --no-progress
          --logger-github

      - name: Reject skipped whole-tree mutants
        if: github.event_name != 'pull_request'
        run: |
          php -r '
            $report = json_decode(file_get_contents("build/infection/infection.json"), true, 512, JSON_THROW_ON_ERROR);
            if (($report["stats"]["skippedCount"] ?? null) !== 0) {
                fwrite(STDERR, "Infection did not report zero skipped mutants; inspect the report and test durations.\n");
                exit(1);
            }
          '

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutation-reports
          path: build/infection/
          if-no-files-found: ignore

  examples:
    name: Example ${{ matrix.example }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        example:
          - basic
          - configuration
          - custom-responses
          - declarative-server
          - faker-customization
          - middleware
          - request-validation
          - vcr-recording
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, date, dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter
          coverage: none

      - name: Install example dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: examples/${{ matrix.example }}
          dependency-versions: highest
          composer-options: --prefer-dist
          require-lock-file: false

      - name: Check installed platform requirements
        run: composer check-platform-reqs
        working-directory: examples/${{ matrix.example }}

      - name: Run example tests
        run: vendor/bin/phpunit
        working-directory: examples/${{ matrix.example }}
