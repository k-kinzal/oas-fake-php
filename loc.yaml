# NOTE: You do not have permission to overwrite this file. Please ask a human operator to perform the changes for you.
scan:
  roots:
    - src
  exclude: []

policies:
  standard:
    limits:
      file:
        lines: 350
        ncloc: 250
      class:
        lines: 300
      trait:
        lines: 150
      interface:
        lines: 120
      enum:
        lines: 120
      function:
        lines: 40
        cyclomatic_complexity: 12
      method:
        lines: 40
        cyclomatic_complexity: 12

apply:
  default: standard
  rules: []

report:
  reporter: ai
  order_by:
    - path
    - line
    - rule
