# NOTE: You do not have permission to overwrite this file. Please ask a human operator to perform the changes for you.
deptrac:
  paths:
    - ./src
  exclude_files:
    - '#.*/vendor/.*#'
  layers:
    - name: Application
      collectors:
        - type: directory
          value: src/Application/.*
    - name: Interception
      collectors:
        - type: directory
          value: src/Interception/.*
    - name: Handling
      collectors:
        - type: directory
          value: src/Handling/.*
    - name: Generation
      collectors:
        - type: directory
          value: src/Generation/.*
    - name: OpenApi
      collectors:
        - type: directory
          value: src/OpenApi/.*
    - name: Exception
      collectors:
        - type: directory
          value: src/Exception/.*
  ruleset:
    Application:
      - Interception
      - Handling
      - Generation
      - OpenApi
      - Exception
    Interception:
      - Handling
      - Generation
      - OpenApi
      - Exception
    Handling:
      - Generation
      - OpenApi
      - Exception
    Generation:
      - OpenApi
    OpenApi:
      - Exception
    Exception: ~
